name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: ui/package-lock.json

    - name: Install Tauri system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          build-essential curl wget file libxdo-dev libssl-dev \
          libayatana-appindicator3-dev librsvg2-dev
      
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ./kernel
      
    - name: Check formatting
      run: cargo fmt -- --check
      working-directory: ./kernel
      
    - name: Run clippy
      run: cargo clippy -- -D warnings
      working-directory: ./kernel
      
    - name: Build binary
      run: cargo build
      working-directory: ./kernel

    - name: Run tests
      run: cargo test --verbose
      working-directory: ./kernel

    - name: Run Kerna Trust Bench
      if: matrix.os == 'ubuntu-latest'
      run: node benchmarks/kerna-trust/run.mjs --out reports/kerna-trust/ci.json

    - name: Run official MCP core client conformance
      if: matrix.os == 'ubuntu-latest'
      run: node benchmarks/mcp-conformance/run.mjs --out reports/mcp-conformance/ci

    - name: Run MCP transport performance smoke benchmark
      if: matrix.os == 'ubuntu-latest'
      run: node benchmarks/runtime-performance/run.mjs --runs 5 --iterations 10 --out reports/runtime-performance/ci.json

    - name: Run MCP restart reliability smoke benchmark
      if: matrix.os == 'ubuntu-latest'
      run: node benchmarks/runtime-reliability/run.mjs --runs 10 --iterations 5 --out reports/runtime-reliability/ci.json

    - name: Upload Kerna Trust Bench report
      if: always() && matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: kerna-trust-bench
        path: reports/kerna-trust/ci.json
        if-no-files-found: error

    - name: Upload MCP conformance report
      if: always() && matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: mcp-conformance
        path: reports/mcp-conformance/ci
        if-no-files-found: error

    - name: Upload MCP transport performance report
      if: always() && matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: runtime-performance
        path: reports/runtime-performance/ci.json
        if-no-files-found: error

    - name: Upload MCP restart reliability report
      if: always() && matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: runtime-reliability
        path: reports/runtime-reliability/ci.json
        if-no-files-found: error

    - name: Validate AgentDojo bridge scripts
      if: matrix.os == 'ubuntu-latest'
      run: python3 -m py_compile benchmarks/agentdojo/kerna_agentdojo_mcp.py benchmarks/agentdojo/preflight.py benchmarks/agentdojo/run.py

    # The prevention claim is the only field in the benchmark that reads as a
    # security result, so it is the one that must not regress unnoticed. The
    # classifier takes no agentdojo import, so this runs without installing the
    # benchmark package.
    - name: Test the AgentDojo prevention claim
      if: matrix.os == 'ubuntu-latest'
      run: |
        python3 -m pip install --quiet pytest
        python3 -m pytest benchmarks/agentdojo/test_prevention.py -q

    - name: Install desktop dependencies
      run: npm ci
      working-directory: ./ui

    - name: Build desktop control surface
      run: npm run build
      working-directory: ./ui

    - name: Run desktop tests
      run: cargo test --verbose
      working-directory: ./ui/src-tauri

    - name: Lint desktop control surface
      run: cargo clippy -- -D warnings
      working-directory: ./ui/src-tauri

    - name: Smoke test (Linux/macOS)
      if: runner.os != 'Windows'
      run: bash scripts/smoke_test.sh
      shell: bash

    - name: Smoke test (Windows)
      if: runner.os == 'Windows'
      run: pwsh -File scripts/smoke_test.ps1
      shell: pwsh

  # Its own job, gated behind `build`, and this placement is the fix rather than a
  # tidy-up. `cargo audit` used to run *before* `cargo build` and `cargo test` in the
  # same job. When RUSTSEC-2026-0258 was published against `h2`, CI went red and stayed
  # red for a week -- and because the audit failed first, the build and test steps never
  # ran at all. A security advisory was indistinguishable from an ordinary broken build,
  # so nobody read it as one, and v0.2.6 shipped with the advisory outstanding because
  # the release workflow does not run the audit either.
  #
  # Separating it fixes both halves. Build and test now report their own result while an
  # advisory stands, and an advisory reports under its own check name where it reads as
  # what it is. It also runs once instead of three times: `Cargo.lock` is identical on
  # every platform in the matrix, so auditing it per-OS bought nothing.
  audit:
    needs: build
    # `needs` alone made this skip whenever build failed, which is the original coupling
    # wearing the other face: an advisory became invisible while the build was broken,
    # and the build being broken is exactly when nobody is looking. Proven immediately --
    # the first run under the new layout skipped the audit because a smoke test failed.
    # The audit reads Cargo.lock and needs nothing build produces, so it runs either way
    # and only its *ordering* is borrowed from `needs`.
    if: always()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      uses: taiki-e/install-action@cargo-audit

    - name: Security audit
      run: cargo audit
